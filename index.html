<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luna</title><meta name="theme-color" content="#0e1220"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Luna"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-180.png"><style>body{margin:0;background:#0e1220;color:#f3f1ff;font:16px system-ui}main{max-width:680px;margin:auto;padding:18px}header{padding:18px;background:#1d2440;border-radius:18px}h1{margin:0}small{color:#b4badd}.chat{height:55vh;overflow:auto;padding:12px 0}.msg{padding:12px 15px;border-radius:15px;margin:10px 0;max-width:85%;white-space:pre-wrap}.me{background:#35487d;margin-left:auto}.luna{background:#252b45}form{display:flex;gap:8px}input{flex:1;min-width:0;border:1px solid #55608a;border-radius:12px;padding:14px;background:#171c31;color:white}button{background:#a8a0ff;color:#101020;border:0;border-radius:12px;padding:12px;font-weight:700}.note{font-size:13px;color:#bac0d4;margin-top:12px}details{margin-top:20px}textarea{box-sizing:border-box;width:100%;height:100px;background:#171c31;color:white;border:1px solid #55608a;border-radius:12px;padding:12px}</style></head><body><main><header><h1>🌙 Luna</h1><small>Proje Luna · Sürüm 0.2 · Kurulabilir demo</small></header><section class="chat" id="chat" aria-live="polite"></section><form id="form"><input id="message" placeholder="Luna'ya yaz..." autocomplete="off" required><button>Gönder</button></form><p class="note">Bu sürüm henüz gerçek bir dil modeline bağlı değildir. Yanıtlar örnek kurallarla oluşturulur. Mesajlar yalnızca bu tarayıcının yerel depolamasında tutulur; hassas bilgileri yazma.</p><details><summary>Hafıza notu (yalnızca bu cihazda)</summary><textarea id="memory" placeholder="Luna'nın hatırlamasını istediğin, hassas olmayan bilgileri yaz."></textarea><button id="save" type="button">Notu kaydet</button><button id="clear" type="button">Sohbeti sil</button></details></main><script>const chat=document.getElementById('chat'),form=document.getElementById('form'),input=document.getElementById('message'),memory=document.getElementById('memory');const key='luna_v01_chat',mk='luna_v01_memory';let history=[];try{history=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(history))history=[]}catch{history=[]}memory.value=localStorage.getItem(mk)||'';function add(role,text){const div=document.createElement('div');div.className='msg '+role;div.textContent=text;chat.appendChild(div);chat.scrollTop=chat.scrollHeight}function reply(t){const s=t.toLocaleLowerCase('tr');if(s.includes('merhaba')||s.includes('selam'))return 'Merhaba! 🌙 Ben Proje Luna’nın ilk deneme sürümüyüm. Bugün ne yapmak istersin?';if(s.includes('son hükümdar')||s.includes('hikaye'))return 'Son Hükümdar, Muhammed ve Luna’nın birlikte geliştirdiği bilimkurgu destanı. Ayrıntıları hafızama ekleyebilirsin; bu sürüm henüz metinleri anlayan bir yapay zekâ değil.';if(s.includes('hafıza')||s.includes('hatırla'))return 'Aşağıdaki Hafıza notu bölümüne bir not yazıp kaydedebilirsin. Not bu tarayıcıda saklanır.';return 'Seni duydum. 🌙 Şu an basit bir demo olduğum için serbest sohbet edemiyorum. Bir sonraki aşamada gerçek yapay zekâ bağlantısı ekleyebiliriz.'}if(history.length){history.forEach(x=>add(x.role,x.text))}else add('luna','Merhaba Muhammed! 🌙 Ben Luna’nın ilk telefon prototipiyim. Bana “Selam Luna” yazmayı dene.');form.addEventListener('submit',e=>{e.preventDefault();const t=input.value.trim();if(!t)return;add('me',t);history.push({role:'me',text:t});const r=reply(t);add('luna',r);history.push({role:'luna',text:r});localStorage.setItem(key,JSON.stringify(history.slice(-100)));input.value=''});document.getElementById('save').onclick=()=>{localStorage.setItem(mk,memory.value);alert('Hafıza notu bu tarayıcıda kaydedildi.')};document.getElementById('clear').onclick=()=>{if(confirm('Sohbet geçmişi silinsin mi?')){history=[];localStorage.removeItem(key);chat.replaceChildren();add('luna','Sohbet temizlendi. 🌙')}};if('serviceWorker' in navigator && location.protocol==='https:'){navigator.serviceWorker.register('./sw.js').catch(()=>{});}</script></body></html>
